<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>لا يوجد اتصال — الذرى</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 24px; background: #f6f0e1; color: #26301a;
        font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #12160e; color: #e9eadf; }
        .card { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); }
      }
      .card {
        width: 100%; max-width: 380px; text-align: center; padding: 28px 22px;
        border-radius: 24px; background: rgba(255,255,255,.65);
        border: 1px solid rgba(0,0,0,.08); backdrop-filter: blur(12px);
      }
      .logo {
        width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 18px;
        background: #5b6b3a; color: #fff; display: grid; place-items: center;
        font-size: 26px; font-weight: 700;
      }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { font-size: 14px; opacity: .75; margin: 0 0 20px; line-height: 1.7; }
      button {
        width: 100%; padding: 13px; border: 0; border-radius: 16px; cursor: pointer;
        background: #5b6b3a; color: #fff; font-size: 15px; font-weight: 700;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">ذ</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>لا يمكن فتح هذه الصفحة الآن. الصفحات التي زرتها سابقًا ما زالت متاحة، وسيعود كل شيء فور رجوع الاتصال.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
